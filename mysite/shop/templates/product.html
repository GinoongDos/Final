{% extends "base.html" %}
{% block title %}Products – Shop{% endblock %}
{% block content %}
<h1>Products</h1>
<p><a href="{% url 'shop:product_add' %}" class="btn btn-primary">Add product</a></p>

<section aria-label="Product list">
    <table>
        <thead>
            <tr>
                <th>Product name</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
            <tr>
                <td>{{ p.name }}</td>
                <td>₱{{ p.price }}</td>
                <td class="actions">
                    <a href="{% url 'shop:product_edit' p.pk %}">Edit</a>
                    <a href="{% url 'shop:product_delete' p.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="empty">No products yet. Add one to get started.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
