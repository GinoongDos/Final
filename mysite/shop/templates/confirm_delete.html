{% extends "base.html" %}
{% block title %}Confirm delete – Shop{% endblock %}
{% block content %}
<h1>Confirm delete</h1>
<p><strong>Are you sure you want to delete this?</strong></p>
<p>{{ object }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Yes, delete</button>
    <a href="{% if back_url %}{% url back_url %}{% else %}#{% endif %}">Cancel</a>
</form>
{% endblock %}
