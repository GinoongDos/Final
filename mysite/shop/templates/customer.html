{% extends "base.html" %}
{% block title %}Customers – Shop{% endblock %}
{% block content %}
<h1>Customers</h1>
<p><a href="{% url 'shop:customer_add' %}" class="btn btn-primary">Add customer</a></p>

<section aria-label="Customer list">
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for c in customers %}
            <tr>
                <td>{{ c.name }}</td>
                <td>{{ c.email }}</td>
                <td class="actions">
                    <a href="{% url 'shop:order_create' c.id %}">Create order</a>
                    <a href="{% url 'shop:customer_edit' c.pk %}">Edit</a>
                    <a href="{% url 'shop:customer_delete' c.pk %}">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="empty">No customers yet. Add one to get started.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
